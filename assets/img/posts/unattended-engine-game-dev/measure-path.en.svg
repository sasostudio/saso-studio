<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Balance measurement before and after: from Master running it to the builder's self-check"><title>Balance measurement before and after: from Master running it to the builder's self-check</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="329" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><text x="24" y="30.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#b7352c" font-weight="700" text-anchor="start">Before — Master runs it</text><text x="384" y="30.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#276843" font-weight="700" text-anchor="start">After — measurement in the self-check</text><line x1="360" y1="18" x2="360" y2="286" stroke="#d9d0bb" stroke-width="1.2"/><rect x="24" y="46" width="130" height="64" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="38" y="70.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="15" fill="#1e2430" font-weight="600" text-anchor="start">Builder AI</text><text x="38" y="92.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothi