<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="테스트 시간 회귀: 갱신마다 노드 재생성 대 노드 풀 재사용"><title>테스트 시간 회귀: 갱신마다 노드 재생성 대 노드 풀 재사용</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="319" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><text x="24" y="30.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#b7352c" font-weight="700" text-anchor="start">이전 — 갱신마다 새로 생성</text><text x="384" y="30.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#276843" font-weight="700" text-anchor="start">이후 — 풀에서 번호순 재사용</text><line x1="360" y1="18" x2="360" y2="276" stroke="#d9d0bb" stroke-width="1.2"/><rect x="24" y="46" width="96" height="44" rx="6" fill="#ebe4d1" stroke="#b3a78b" stroke-width="1.2"/><text x="72" y="73.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">화면 갱신</text><line x1="122" y1="68" x2="156" y2="68" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="160" y="46" width="184" height="50" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="172" y="66.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#49505e" font-weight="500" text-anchor="start">노드 약 200개 생성</text><text x="172" y="81.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#49505e" font-weight="500" text-anchor="start">이전 노드는 queue_free</text><rect x="24" y="112" width="320" height="74" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.5"/><text x="38" y="134.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#b7352c" font-weight="600" text-anchor="start">헤드리스 시험: 프레임 미진행</text><text x="38" y="150.7" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#b7352c" font-weight="600" text-anchor="start">→ 해제 대기 노드가 시험 끝까지 누적</text><text x="38" y="167.3" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#b7352c" font-weight="600" text-anchor="start">→ 글자 모양 재계산 반복</text><text x="24" y="222.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="15" fill="#b7352c" font-weight="700" text-anchor="start">전체 테스트 570초</text><text x="24" y="244.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#6b655a" font-weight="500" text-anchor="start">(M2 이전 80초)</text><rect x="384" y="46" width="96" height="44" rx="6" fill="#ebe4d1" stroke="#b3a78b" stroke-width="1.2"/><text x="432" y="73.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">화면 갱신</text><line x1="482" y1="68" x2="516" y2="68" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="520" y="46" width="176" height="60" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="530" y="64.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="10.5" fill="#276843" font-weight="600" text-anchor="start">칠판 · 글자 · 버튼 = 풀</text><text x="530" y="78.7" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="10.5" fill="#276843" font-weight="600" text-anchor="start">바뀐 값만 덮어쓰기</text><text x="530" y="93.4" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="10.5" fill="#276843" font-weight="600" text-anchor="start">남는 것은 숨김 처리</text><rect x="384" y="122" width="312" height="44" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="540" y="149.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="600" text-anchor="middle">새 시험: 갱신 뒤 노드 수 불변</text><text x="384" y="222.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="15" fill="#276843" font-weight="700" text-anchor="start">36초</text><text x="360" y="302.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#6b655a" font-weight="600" text-anchor="middle">원인은 코드 분석으로 판정 (작업자 셸 부재로 실측 불가) · 기존 시험 삭제 0건</text></svg>
